<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>青青草原記帳本</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
    </style>
</head>
<body>

    <!-- 登入畫面 -->
    <div id="login-section">
        <div class="login-box">
            <h1 style="color: var(--dark-green);">🌱 青青草原記帳本</h1>
            <p>紀錄生活，享受自然</p>
            <div style="margin-top: 2rem;">
                <input type="text" id="login-google-id" placeholder="輸入 Google ID (模擬)" value="user123">
                <input type="text" id="login-nickname" placeholder="輸入暱稱" value="測試小草">
                <button class="btn" onclick="app.login()">進入草原</button>
            </div>
            <p style="font-size: 0.8rem; color: #888; margin-top: 1rem;">測試模式：直接輸入 ID 即可登入</p>
        </div>
    </div>

    <!-- 主應用程式 (登入後顯示) -->
    <div id="main-app" class="hidden">
        <header>
            <h1>🍃 青青草原記帳</h1>
            <div class="user-info">
                <span id="user-display-name"></span>
                <a href="#" onclick="app.logout()" style="color: white; margin-left: 10px; text-decoration: none;">(登出)</a>
            </div>
        </header>

        <div class="container">
            <!-- 導航分頁 -->
            <div class="tabs">
                <div class="tab active" onclick="app.switchTab('dashboard')">總覽</div>
                <div class="tab" onclick="app.switchTab('accounts')">我的帳戶</div>
                <div class="tab" onclick="app.switchTab('records')">收支紀錄</div>
                <div class="tab" onclick="app.switchTab('family')">家庭共享</div>
            </div>

            <!-- 1. 總覽 Dashboard -->
            <div id="tab-dashboard" class="tab-content">
                <div class="card">
                    <h2>我的資產</h2>
                    <div class="balance" id="total-balance">$ 0</div>
                    <div class="dashboard-grid">
                        <div style="text-align: center; color: #2e7d32;">
                            <small>總收入</small>
                            <div id="total-income" style="font-weight: bold;">$ 0</div>
                        </div>
                        <div style="text-align: center; color: #c62828;">
                            <small>總支出</small>
                            <div id="total-expense" style="font-weight: bold;">$ 0</div>
                        </div>
                    </div>
                </div>

                <div class="dashboard-grid">
                    <div class="card">
                        <h2>近期支出分類</h2>
                        <div id="category-stats-container">
                            <!-- JS 填入 -->
                            <p style="color:#888; text-align:center;">載入中...</p>
                        </div>
                    </div>
                    <div class="card">
                        <h2>快速操作</h2>
                        <button class="btn" style="width: 100%; margin-bottom: 10px;" onclick="app.showModal('modal-record')">✏️ 記一筆</button>
                        <button class="btn btn-outline" style="width: 100%;" onclick="app.showModal('modal-account')">💰 新增帳戶</button>
                    </div>
                </div>
            </div>

            <!-- 2. 帳戶 Accounts -->
            <div id="tab-accounts" class="tab-content hidden">
                <div class="card">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <h2>我的存摺</h2>
                        <button class="btn btn-outline" onclick="app.showModal('modal-account')">+ 新增帳戶</button>
                    </div>
                    <div id="accounts-list" style="margin-top: 1rem;">
                        <!-- JS 填入 -->
                    </div>
                </div>
            </div>

            <!-- 3. 紀錄 Records -->
            <div id="tab-records" class="tab-content hidden">
                <div class="card">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <h2>收支明細</h2>
                        <button class="btn btn-outline" onclick="app.showModal('modal-record')">+ 記帳</button>
                    </div>
                    <div id="records-list" style="margin-top: 1rem;">
                        <!-- JS 填入 -->
                    </div>
                </div>
            </div>

            <!-- 4. 家庭 Family -->
            <div id="tab-family" class="tab-content hidden">
                <!-- 未加入家庭顯示 -->
                <div id="no-family-view" class="hidden">
                    <div class="dashboard-grid">
                        <div class="card" style="text-align: center;">
                            <h2>建立新家庭</h2>
                            <p>成為家長，邀請成員加入</p>
                            <input type="text" id="new-family-name" placeholder="家庭名稱 (如: 幸福一家)">
                            <button class="btn" onclick="app.createFamily()">建立家庭</button>
                        </div>
                        <div class="card" style="text-align: center;">
                            <h2>加入現有家庭</h2>
                            <p>輸入邀請碼加入</p>
                            <input type="text" id="join-family-code" placeholder="輸入邀請碼">
                            <button class="btn btn-outline" onclick="app.joinFamily()">申請加入</button>
                        </div>
                    </div>
                </div>

                <!-- 已加入家庭顯示 -->
                <div id="family-view" class="hidden">
                    <div class="card">
                        <h2>🏠 家庭成員</h2>
                        <div id="family-members-list" class="dashboard-grid">
                            <!-- JS 填入 -->
                        </div>
                    </div>
                    
                    <div class="card">
                        <h2>📊 全家收支概況</h2>
                        <div id="family-stats-list">
                             <!-- JS 填入 -->
                        </div>
                    </div>

                    <div class="card">
                        <h2>⚙️ 隱私設定</h2>
                        <div style="display: flex; gap: 20px; align-items: center;">
                            <label>
                                <input type="checkbox" id="setting-share-stats" onchange="app.updatePrivacy()"> 分享統計數據
                            </label>
                            <label>
                                <input type="checkbox" id="setting-share-accounts" onchange="app.updatePrivacy()"> 分享詳細帳戶
                            </label>
                        </div>
                    </div>
                    
                    <!-- Host 專區 -->
                     <div class="card" id="host-zone" style="display: none; border-color: orange;">
                        <h2 style="color: chocolate;">👑 家長管理區</h2>
                        <h3>待審核申請</h3>
                        <div id="join-requests-list">
                            <p>暫無申請</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modals -->

    <!-- 新增帳戶 Modal -->
    <div id="modal-account" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="app.closeModal('modal-account')">&times;</span>
            <h2>新增帳戶</h2>
            <input type="text" id="acc-name" placeholder="帳戶名稱 (如: 薪資戶)">
            <input type="number" id="acc-balance" placeholder="初始餘額" value="0">
            <button class="btn" style="width: 100%; margin-top: 10px;" onclick="app.createAccount()">建立</button>
        </div>
    </div>

    <!-- 記帳 Modal -->
    <div id="modal-record" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="app.closeModal('modal-record')">&times;</span>
            <h2>記一筆</h2>
            
            <label>類型</label>
            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                <button class="btn" id="btn-type-expense" onclick="app.setRecordType('EXPENSE')" style="flex:1;">支出</button>
                <button class="btn btn-outline" id="btn-type-income" onclick="app.setRecordType('INCOME')" style="flex:1;">收入</button>
            </div>
            
            <label>帳戶</label>
            <select id="record-account-select">
                <option>載入中...</option>
            </select>

            <label>金額</label>
            <input type="number" id="record-amount" placeholder="金額">

            <label>分類</label>
            <select id="record-category-select" onchange="app.onCategoryChange()">
                <option value="">請選擇主分類</option>
            </select>
            
            <div style="display: flex; gap: 5px; margin-top: 5px;">
                <select id="record-sub-select" style="flex: 1;" onchange="app.onSubCategoryChange()">
                    <option value="">請選擇子分類</option>
                </select>
                <!-- 自訂輸入框區塊 (預設隱藏) -->
                <div id="record-sub-custom-wrapper" style="display: none; flex: 1; gap: 5px;">
                    <input type="text" id="record-sub-input" placeholder="輸入新分類名稱" style="flex: 1;">
                    <button type="button" class="btn btn-outline" style="padding: 0 10px;" onclick="app.cancelCustomSub()">✕</button>
                </div>
            </div>

            <label>日期</label>
            <input type="date" id="record-date">

            <label>備註</label>
            <input type="text" id="record-note" placeholder="備註">

            <button class="btn" style="width: 100%; margin-top: 10px;" onclick="app.createRecord()">儲存</button>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
